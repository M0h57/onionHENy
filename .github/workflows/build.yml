name: Build OnionHEN

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OnionHEN Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            clang \
            lld \
            llvm \
            git \
            python3 \
            libssl-dev

      - name: Setup PS5 Payload SDK / Toolchain
        run: |
          # Fetch and prepare submodules/dependencies if script exists
          if [ -f "./scripts/sync_dependencies.sh" ]; then
            chmod +x ./scripts/sync_dependencies.sh
            ./scripts/sync_dependencies.sh
          fi

      - name: Compile OnionHEN
        run: |
          mkdir -p build && cd build
          if [ -f "../scripts/ps5_cmake.sh" ]; then
            chmod +x ../scripts/ps5_cmake.sh
            ../scripts/ps5_cmake.sh --build-type Release
          elif [ -f "../CMakeLists.txt" ]; then
            cmake .. -DCMAKE_BUILD_TYPE=Release
            cmake --build . --config Release -j$(nproc)
          else
            make -j$(nproc)
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnionHEN-Build
          path: |
            build/*.elf
            build/*.bin
            build/output/
            *.elf

      - name: Create GitHub Release (Manual Trigger Only)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OnionHEN Custom Build #${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            build/*.elf
            build/*.bin
            *.elf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
