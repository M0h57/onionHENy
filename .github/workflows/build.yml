name: Build OnionHEN

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: false
        default: "Release"
        type: choice
        options:
          - Debug
          - Release

env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OnionHEN Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Uses the repo's own Dockerfile: installs clang-18/lld-18/cmake/ninja,
      # clones ps5-payload-dev/sdk, builds+installs it, and runs libcxx.sh —
      # this is the same environment scripts/build.sh expects PS5_PAYLOAD_SDK
      # to already be set up in.
      - name: Build OnionHEN builder image
        run: |
          docker compose build onionhen-build
          # Tag it under a stable name so later plain `docker run` steps
          # (which need to bypass compose's own volume mounts) can find it.
          image_id="$(docker compose config --images onionhen-build)"
          docker tag "${image_id}" onionhen-builder:ci

      # util/CMakeLists.txt hard-requires libcurl.a + curl.h + ca-bundle.crt
      # under $PS5_PAYLOAD_SDK/target/user/homebrew (cheat-catalog HTTPS).
      # Locally this comes from a bind-mounted ./.docker/pacbrew-ps5 you
      # populate yourself; it doesn't exist on a clean CI checkout, so build
      # it here once and cache it — pin the tag so cache invalidates on
      # intentional bumps only.
      - name: Cache pacbrew PS5 homebrew libs (curl + deps)
        id: pacbrew-cache
        uses: actions/cache@v4
        with:
          path: .docker/pacbrew-ps5
          key: pacbrew-ps5-libs-v0.36

      - name: Build pacbrew PS5 homebrew libs (curl + deps)
        if: steps.pacbrew-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .docker/pacbrew-ps5
          # IMPORTANT: run this in a clean ubuntu:24.04 container, NOT
          # onionhen-builder:ci. ci-libs.sh installs its own `ps5-payload-sdk`
          # pacman package into /opt/ps5-payload-sdk — that collides with the
          # SDK our Dockerfile already built there from source (pacman refuses
          # to overwrite files it doesn't own). Building pacbrew's libs in an
          # isolated container sidesteps the conflict entirely; we only need
          # target/user/homebrew out of it afterward.
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            ubuntu:24.04 \
            /bin/bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                sudo bash build-essential ca-certificates clang-18 cmake \
                curl lld-18 llvm-18 make meson ninja-build pkg-config \
                python3 python3-pyelftools socat unzip wget xz-utils \
                libssl-dev librsvg2-bin git \
                autoconf libtool yasm nasm bison flex gperf pkgconf \
                libarchive-tools autopoint po4a doxygen makepkg \
                pacman-package-manager python3-mako python3-glad
              useradd --create-home --shell /bin/bash builder
              echo "builder ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/builder
              chmod 0440 /etc/sudoers.d/builder
              chown -R builder:builder /workspace
              su - builder -c "
                set -euo pipefail
                git clone --depth 1 --branch v0.36 \
                  https://github.com/ps5-payload-dev/pacbrew-repo.git /tmp/pacbrew-repo
                cd /tmp/pacbrew-repo
                export LLVM_CONFIG=/usr/lib/llvm-18/bin/llvm-config
                export PATH=/usr/lib/llvm-18/bin:\${PATH}
                export MAKEFLAGS=-j\$(nproc)
                ./ci-libs.sh
                cp -a /opt/ps5-payload-sdk/target/user/homebrew/. /workspace/.docker/pacbrew-ps5/
              "
            '

      - name: Compile OnionHEN (scripts/build.sh inside container)
        run: |
          docker compose run --rm \
            -e BUILD_TYPE="${{ env.BUILD_TYPE }}" \
            onionhen-build \
            /bin/bash -lc '
              set -euo pipefail
              rm -rf /tmp/onionhen-build
              cp -a /workspace/. /tmp/onionhen-build
              git -C /tmp/onionhen-build submodule update --init --recursive
              cd /tmp/onionhen-build
              export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
              export LLVM_CONFIG=/usr/lib/llvm-18/bin/llvm-config
              export PATH="/usr/lib/llvm-18/bin:${PS5_PAYLOAD_SDK}/bin:${PATH}"
              ./scripts/build.sh --build-type "${BUILD_TYPE}" --jobs "$(nproc)"
              rm -rf /workspace/build
              cp -a /tmp/onionhen-build/build /workspace/build
            '

      - name: List build outputs
        run: ls -lahR build/bin || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnionHEN-${{ env.BUILD_TYPE }}-${{ github.sha }}
          path: |
            build/bin/*.elf
            build/bin/*.lzma
          if-no-files-found: error

      - name: Create GitHub Release (Manual Trigger Only)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OnionHEN Custom Build #${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            build/bin/*.elf
            build/bin/*.lzma
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
